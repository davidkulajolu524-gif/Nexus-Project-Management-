[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "davidkulajolu524-gif", email = "davidkulajolu524@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "fastapi-mail>=1.6.8",
    "python-dotenv>=1.2.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
